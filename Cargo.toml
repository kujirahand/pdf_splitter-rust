[package]
name = "pdf_splitter"
version = "0.1.0"
edition = "2021"

[dependencies]
lopdf = "0.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# macOSアプリバンドル用の設定
[[bin]]
name = "pdf_splitter"
path = "src/main.rs"

# カスタムビルドコマンドのエイリアス
[package.metadata.commands]
build-macos-app = "./build_macos_app.sh"
